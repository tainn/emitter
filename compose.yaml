services:
  emitter:
    build:
      context: .
    image: emitter:0.1.2
    container_name: emitter
    restart: unless-stopped
    networks:
      - ffa
    env_file:
      - .env
    labels:
      - "tainn.type=app"
    command: [ "uv", "run", "/app/src/main.py" ]

networks:
  ffa:
    external: true
