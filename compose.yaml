services:
  emitter:
    build:
      context: "."
      dockerfile: "Containerfile"
    image: "emitter:0.1.5"
    container_name: "emitter"
    restart: "unless-stopped"
    networks:
      - "emitter"
    env_file:
      - ".env"
    entrypoint: [ "uv", "run", "/app/src/main.py" ]

networks:
  emitter:
    external: true
