services:
  emitter:
    build:
      context: "."
      dockerfile: "Containerfile"
    image: "emitter:${VERSION}"
    container_name: "emitter"
    restart: "unless-stopped"
    networks:
      - "emitter"
    env_file:
      - ".env"
    entrypoint: [ "/app/emitter" ]

networks:
  emitter:
    external: true
